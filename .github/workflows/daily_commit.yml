name: Daily Commit Automation

on:
  schedule:
    - cron: '0 0 * * *'  # Runs once per day at midnight (adjust this as per your need)
  workflow_dispatch:

jobs:
  daily_commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Git user with email rafrafrezakne@gmail.com
        run: |
          git config --global user.email "rafrafrezakne@gmail.com"
          git config --global user.name "Ghazi-R3 Automation"

      - name: Make daily commit with email rafrafrezakne@gmail.com
        run: |
          echo "Daily commit update: $(date)" >> daily_commit_log.txt
          git add daily_commit_log.txt
          git commit -m "Automated daily commit by Ghazi-R3 Automation"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
